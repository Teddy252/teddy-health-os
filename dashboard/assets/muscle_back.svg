<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="backGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Body Contour Back View -->
  <path d="M100 25 C88 25 80 38 80 52 C55 65 40 85 35 115 C32 135 45 155 60 180 L140 180 C155 155 168 135 165 115 C160 85 145 65 120 52 C120 38 112 25 100 25 Z" stroke="#2A2E3D" stroke-width="2.5" fill="#12141D"/>
  <!-- Spine Line -->
  <path d="M100 50 L100 175" stroke="#3A4055" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Traps Upper Back -->
  <path d="M100 52 L78 65 L100 105 L122 65 Z" fill="url(#backGlow)" opacity="0.8"/>
  <!-- Left Latissimus (V-Taper Wing) -->
  <path d="M96 90 C75 90 52 105 46 128 C42 142 55 152 70 148 C85 144 95 125 96 100 Z" fill="url(#backGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Right Latissimus (V-Taper Wing) -->
  <path d="M104 90 C125 90 148 105 154 128 C158 142 145 152 130 148 C115 144 105 125 104 100 Z" fill="url(#backGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Wings striations -->
  <path d="M90 105 C78 110 65 120 55 130 M110 105 C122 110 135 120 145 130" stroke="#FFE600" stroke-width="1.5" fill="none" opacity="0.8"/>
</svg>