<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="armGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Torso Context -->
  <path d="M80 50 Q100 45 120 50 L125 170 L75 170 Z" fill="#12141D" stroke="#2A2E3D" stroke-width="2"/>
  <!-- Left Arm Outline -->
  <path d="M78 55 C65 58 52 75 48 95 C42 120 48 145 52 175 L68 175 C66 150 68 128 74 110 Z" fill="#181B26" stroke="#2A2E3D" stroke-width="2"/>
  <!-- Right Arm Outline -->
  <path d="M122 55 C135 58 148 75 152 95 C158 120 152 145 148 175 L132 175 C134 150 132 128 126 110 Z" fill="#181B26" stroke="#2A2E3D" stroke-width="2"/>
  <!-- Left Biceps Peak Glow -->
  <path d="M56 85 C50 95 52 110 60 115 C68 118 72 108 72 95 C72 85 64 80 56 85 Z" fill="url(#armGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Right Biceps Peak Glow -->
  <path d="M144 85 C150 95 148 110 140 115 C132 118 128 108 128 95 C128 85 136 80 144 85 Z" fill="url(#armGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Forearms Accent -->
  <path d="M52 130 C48 145 54 165 60 170 L65 170 C64 155 60 140 58 130 Z" fill="url(#armGlow)" opacity="0.75"/>
  <path d="M148 130 C152 145 146 165 140 170 L135 170 C136 155 140 140 142 130 Z" fill="url(#armGlow)" opacity="0.75"/>
</svg>