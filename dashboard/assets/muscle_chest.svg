<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="chestGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Body Outline / Contour -->
  <path d="M100 20 C85 20 75 35 75 50 C55 58 45 75 42 105 C40 125 45 150 48 180 L152 180 C155 150 160 125 158 105 C155 75 145 58 125 50 C125 35 115 20 100 20 Z" stroke="#2A2E3D" stroke-width="2.5" fill="#12141D"/>
  <!-- Clavicle -->
  <path d="M70 60 Q100 70 130 60" stroke="#3A4055" stroke-width="2" fill="none"/>
  <!-- Sternum line -->
  <path d="M100 68 L100 125" stroke="#3A4055" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Highlighted Left Pectoral -->
  <path d="M96 72 C80 72 65 80 58 98 C56 108 62 118 78 120 C88 122 96 112 96 95 Z" fill="url(#chestGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Highlighted Right Pectoral -->
  <path d="M104 72 C120 72 135 80 142 98 C144 108 138 118 122 120 C112 122 104 112 104 95 Z" fill="url(#chestGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Fiber Contours -->
  <path d="M94 82 C82 82 72 88 66 98" stroke="#FFE600" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M106 82 C118 82 128 88 134 98" stroke="#FFE600" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Abdominal outline -->
  <path d="M85 135 Q100 138 115 135 M85 155 Q100 158 115 155 M88 175 Q100 177 112 175" stroke="#2A2E3D" stroke-width="1.5"/>
</svg>