<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <line x1="60" y1="20" x2="60" y2="140" stroke="#5AC8FA" stroke-width="4"/>
  <circle cx="75" cy="45" r="9" fill="#1A1D28" stroke="#5AC8FA"/>
  <line x1="63" y1="55" x2="63" y2="95" stroke="#5AC8FA" stroke-width="5" stroke-linecap="round"/>
  <line x1="63" y1="95" x2="125" y2="98" stroke="#D4FF00" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="125" y1="98" x2="125" y2="140" stroke="#5AC8FA" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="115" y1="140" x2="145" y2="140" stroke="#5AC8FA" stroke-width="4" stroke-linecap="round"/>
  <circle cx="125" cy="98" r="6" fill="url(#cyanGlow)" filter="url(#glow)"/>
  <text x="135" y="92" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Ângulo 60°-70°</text>
  <text x="95" y="152" fill="#5AC8FA" font-family="monospace" font-size="8.5" font-weight="bold">Pés Firmes no Chão</text>
  <text x="75" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">WALL SIT ISOMÉTRICO</text>
  <text x="75" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Analgesia clínica do tendão patelar</text>

</svg>