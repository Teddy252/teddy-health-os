<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <circle cx="50" cy="105" r="9" fill="#1A1D28" stroke="#2A2E3D"/>
  <path d="M58 108 L115 115" stroke="#2A2E3D" stroke-width="5" stroke-linecap="round"/>
  <circle cx="115" cy="115" r="8" fill="url(#cyanGlow)" filter="url(#glow)"/>
  <path d="M115 115 L150 135 L190 135" stroke="#2A2E3D" stroke-width="4" stroke-linecap="round"/>
  <!-- Top leg opening UPWARD -->
  <path d="M115 115 L155 85 L190 135" stroke="#D4FF00" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="190" cy="135" r="4" fill="#FF3B30"/>
  <path d="M145 125 C155 115 155 105 152 95" stroke="#D4FF00" stroke-width="2" fill="none"/>
  <polygon points="152,95 147,101 155,103" fill="#D4FF00"/>
  <text x="95" y="100" fill="#5AC8FA" font-family="monospace" font-size="8.5" font-weight="bold">Glúteo Médio</text>
  <text x="165" y="150" fill="#FF3B30" font-family="monospace" font-size="8" font-weight="bold">Pés Unidos</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">CLAMSHELL PÉLVICO</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Protege joelho contra valgo dinâmico</text>

</svg>