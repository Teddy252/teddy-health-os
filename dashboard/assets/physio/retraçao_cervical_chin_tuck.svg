<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <path d="M125 120 L125 75" stroke="#5AC8FA" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 70 C100 70 95 45 110 30 C125 15 150 20 155 45 C158 60 145 70 135 70 Z" fill="#161924" stroke="#2A2E3D" stroke-width="1.5"/>
  <path d="M98 62 L120 62" stroke="#D4FF00" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="120,62 114,57 114,67" fill="#D4FF00"/>
  <path d="M135 25 L135 12" stroke="#5AC8FA" stroke-width="2" stroke-linecap="round"/>
  <polygon points="135,10 131,16 139,16" fill="#5AC8FA"/>
  <text x="65" y="78" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Queixo para trás (Papada)</text>
  <text x="135" y="20" fill="#5AC8FA" font-family="monospace" font-size="8" font-weight="bold">Topo ao teto</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">CHIN TUCK CERVICAL</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Anti-Pescoço de Tartaruga • Alívio C5-C7</text>

</svg>