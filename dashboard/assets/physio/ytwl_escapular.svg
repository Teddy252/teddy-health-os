<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <g transform="translate(25, 45)">
    <circle cx="25" cy="12" r="5" fill="#1A1D28" stroke="#5AC8FA"/>
    <line x1="25" y1="17" x2="25" y2="45" stroke="#2A2E3D" stroke-width="2.5"/>
    <line x1="25" y1="22" x2="10" y2="5" stroke="#D4FF00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="22" x2="40" y2="5" stroke="#D4FF00" stroke-width="2.5" stroke-linecap="round"/>
    <text x="21" y="60" fill="#D4FF00" font-family="monospace" font-size="12" font-weight="bold">Y</text>
  </g>
  <g transform="translate(78, 45)">
    <circle cx="25" cy="12" r="5" fill="#1A1D28" stroke="#5AC8FA"/>
    <line x1="25" y1="17" x2="25" y2="45" stroke="#2A2E3D" stroke-width="2.5"/>
    <line x1="5" y1="24" x2="45" y2="24" stroke="#5AC8FA" stroke-width="2.5" stroke-linecap="round"/>
    <text x="21" y="60" fill="#5AC8FA" font-family="monospace" font-size="12" font-weight="bold">T</text>
  </g>
  <g transform="translate(132, 45)">
    <circle cx="25" cy="12" r="5" fill="#1A1D28" stroke="#5AC8FA"/>
    <line x1="25" y1="17" x2="25" y2="45" stroke="#2A2E3D" stroke-width="2.5"/>
    <path d="M10 18 L18 30 L25 24 L32 30 L40 18" stroke="#30D158" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="20" y="60" fill="#30D158" font-family="monospace" font-size="12" font-weight="bold">W</text>
  </g>
  <g transform="translate(185, 45)">
    <circle cx="25" cy="12" r="5" fill="#1A1D28" stroke="#5AC8FA"/>
    <line x1="25" y1="17" x2="25" y2="45" stroke="#2A2E3D" stroke-width="2.5"/>
    <path d="M10 12 L10 24 L25 24 L40 24 L40 36" stroke="#FF9F0A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="21" y="60" fill="#FF9F0A" font-family="monospace" font-size="12" font-weight="bold">L</text>
  </g>
  <text x="45" y="135" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Aperte as escápulas em cada posição</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">SÉRIE Y-T-W-L</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Blindagem escapular padrão olímpico</text>

</svg>