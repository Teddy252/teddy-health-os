<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <circle cx="80" cy="140" r="4" fill="#FF3B30"/>
  <line x1="80" y1="140" x2="50" y2="140" stroke="#2A2E3D" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="140" x2="115" y2="85" stroke="#D4FF00" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="115" cy="35" r="9" fill="#1A1D28" stroke="#5AC8FA"/>
  <line x1="115" y1="44" x2="115" y2="85" stroke="#5AC8FA" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M115 85 L160 85 L160 140" stroke="#2A2E3D" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M120 85 L142 85" stroke="#D4FF00" stroke-width="2.5"/>
  <polygon points="142,85 136,81 136,89" fill="#D4FF00"/>
  <circle cx="105" cy="88" r="6" fill="url(#cyanGlow)" filter="url(#glow)"/>
  <text x="85" y="105" fill="#5AC8FA" font-family="monospace" font-size="8.5" font-weight="bold">Aperte o Glúteo</text>
  <text x="130" y="75" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Avance o Quadril 5cm</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">ALONGAMENTO DO PSOAS</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Destrava lombar • Cura da postura sentada</text>

</svg>