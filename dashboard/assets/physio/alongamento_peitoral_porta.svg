<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <line x1="45" y1="20" x2="45" y2="140" stroke="#5AC8FA" stroke-width="4"/>
  <path d="M45 50 L45 80 L105 80" stroke="#D4FF00" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="45" cy="80" r="4" fill="#D4FF00"/>
  <circle cx="115" cy="45" r="9" fill="#1A1D28" stroke="#2A2E3D"/>
  <path d="M110 54 L115 110" stroke="#2A2E3D" stroke-width="4.5"/>
  <path d="M90 75 Q105 80 115 75" stroke="#FF3B30" stroke-width="3" filter="url(#glow)"/>
  <path d="M115 110 L140 140" stroke="#5AC8FA" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M115 110 L95 140" stroke="#2A2E3D" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M125 75 L150 75" stroke="#D4FF00" stroke-width="2"/>
  <polygon points="150,75 144,71 144,79" fill="#D4FF00"/>
  <text x="130" y="68" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Passo à Frente</text>
  <text x="55" y="92" fill="#5AC8FA" font-family="monospace" font-size="8.5" font-weight="bold">Braço 90° no batente</text>
  <text x="60" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">ALONGAMENTO PEITORAL</text>
  <text x="60" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Abertura de peitoral menor • Pós-Supino</text>

</svg>