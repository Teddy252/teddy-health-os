<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <path d="M95 135 L95 85 L145 85 L145 135" stroke="#2A2E3D" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="85" x2="80" y2="135" stroke="#FF3B30" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="80" cy="135" r="4" fill="#FF3B30"/>
  <path d="M120 85 Q135 60 145 55" stroke="#D4FF00" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="145" cy="45" r="11" fill="#1A1D28" stroke="#5AC8FA"/>
  <path d="M145 85 L165 60 L145 35" stroke="#5AC8FA" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M130 35 C140 32 150 35 155 40" stroke="#D4FF00" stroke-width="2" fill="none"/>
  <polygon points="155,40 148,38 153,33" fill="#D4FF00"/>
  <text x="45" y="150" fill="#FF3B30" font-family="monospace" font-size="8" font-weight="bold">Mão Ancorada no Assento</text>
  <text x="135" y="98" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Incline em 30°</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">TRAPÉZIO & ELEVADOR</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Desfaz nós de tensão • Alívio no teclado</text>

</svg>