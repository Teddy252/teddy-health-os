<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Hands & Knees ground marks -->
  <circle cx="80" cy="140" r="3" fill="#5AC8FA"/>
  <circle cx="160" cy="140" r="3" fill="#5AC8FA"/>
  <line x1="80" y1="140" x2="80" y2="90" stroke="#2A2E3D" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="160" y1="140" x2="160" y2="95" stroke="#2A2E3D" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="60" cy="100" r="9" fill="#1A1D28" stroke="#5AC8FA"/>
  <!-- Arched Thoracic Spine (Cat - Solid Volt Glow) -->
  <path d="M68 95 Q115 50 160 95" stroke="#D4FF00" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Dotted Cow Spine -->
  <path d="M68 95 Q115 115 160 95" stroke="#5AC8FA" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  <!-- Vertical movement arrow -->
  <path d="M115 85 L115 62" stroke="#D4FF00" stroke-width="2"/>
  <polygon points="115,60 111,67 119,67" fill="#D4FF00"/>
  <text x="85" y="46" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Arqueie vértebras T1-T12</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">CAT-COW & TORÁCICA</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Extensão espinhal • Desfaz cifose</text>

</svg>