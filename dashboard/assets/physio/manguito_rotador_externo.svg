<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Torso & Head -->
  <circle cx="120" cy="35" r="12" fill="#1A1D28" stroke="#5AC8FA" stroke-width="1.5"/>
  <path d="M105 52 C105 48 135 48 135 52 L132 110 L108 110 Z" fill="#161924" stroke="#2A2E3D" stroke-width="1.5"/>
  <!-- Left arm at rest -->
  <path d="M105 54 L92 90 L90 115" stroke="#2A2E3D" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right Arm (Active: 90 deg, locked at rib) -->
  <path d="M135 54 L142 85 L144 85" stroke="#5AC8FA" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Elbow joint locked -->
  <circle cx="142" cy="85" r="4" fill="#D4FF00"/>
  <!-- Forearm rotating OUTWARD -->
  <path d="M142 85 L180 85" stroke="#D4FF00" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Elastic band to base -->
  <line x1="180" y1="85" x2="100" y2="85" stroke="#FF3B30" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- Rotation arrow -->
  <path d="M165 72 C176 75 186 80 188 88" stroke="#5AC8FA" stroke-width="2" stroke-linecap="round" fill="none"/>
  <polygon points="188,88 184,82 192,84" fill="#5AC8FA"/>
  <!-- Shoulder Highlight -->
  <circle cx="135" cy="54" r="6" fill="url(#cyanGlow)" filter="url(#glow)"/>
  <!-- Badges & Callouts -->
  <text x="135" y="102" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Cotovelo a 90° colado</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">MANGUITO EXTERNO</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Rotação para fora • Estabiliza úmero</text>

</svg>