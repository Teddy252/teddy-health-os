<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <circle cx="45" cy="130" r="8" fill="#1A1D28" stroke="#2A2E3D"/>
  <path d="M53 133 L110 133" stroke="#2A2E3D" stroke-width="4.5"/>
  <line x1="110" y1="133" x2="110" y2="50" stroke="#D4FF00" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M75 110 L110 48" stroke="#5AC8FA" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="110" cy="48" r="4" fill="#D4FF00"/>
  <line x1="110" y1="133" x2="180" y2="133" stroke="#2A2E3D" stroke-width="4" stroke-linecap="round"/>
  <path d="M118 75 L118 55" stroke="#D4FF00" stroke-width="2"/>
  <polygon points="118,55 114,61 122,61" fill="#D4FF00"/>
  <text x="120" y="65" fill="#D4FF00" font-family="monospace" font-size="8" font-weight="bold">Joelho reto com toalha</text>
  <text x="115" y="148" fill="#5AC8FA" font-family="monospace" font-size="8" font-weight="bold">Perna oposta no chão</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">ISQUIOTIBIAIS EM DECÚBITO</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Preserva curvatura lombar • Evita hérnia</text>

</svg>