<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <circle cx="120" cy="35" r="11" fill="#1A1D28" stroke="#5AC8FA"/>
  <path d="M105 50 L105 110 L135 110 L135 50 Z" fill="#161924" stroke="#2A2E3D"/>
  <circle cx="118" cy="65" r="4" fill="#5AC8FA"/>
  <line x1="85" y1="65" x2="118" y2="65" stroke="#5AC8FA" stroke-width="2.5"/>
  <circle cx="125" cy="90" r="5" fill="#D4FF00" filter="url(#glow)"/>
  <line x1="150" y1="90" x2="125" y2="90" stroke="#D4FF00" stroke-width="2.5"/>
  <path d="M135 82 C145 86 145 94 135 98" stroke="#D4FF00" stroke-width="2" fill="none"/>
  <path d="M140 78 C153 84 153 96 140 102" stroke="#D4FF00" stroke-width="1.5" fill="none" opacity="0.6"/>
  <text x="65" y="135" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">4s Inalar • 4s Reter • 8s Exalar</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">RESPIRAÇÃO 4-4-8</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Ativação do nervo vago • Restaura VFC/HRV</text>

</svg>