<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <line x1="35" y1="85" x2="140" y2="85" stroke="#5AC8FA" stroke-width="5" stroke-linecap="round"/>
  <circle cx="85" cy="85" r="4" fill="#5AC8FA"/>
  <line x1="140" y1="85" x2="140" y2="45" stroke="#D4FF00" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M165 65 L140 50" stroke="#FF9F0A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="140" cy="48" r="3.5" fill="#FF9F0A"/>
  <path d="M145 55 L125 55" stroke="#D4FF00" stroke-width="2"/>
  <polygon points="125,55 131,51 131,59" fill="#D4FF00"/>
  <circle cx="140" cy="85" r="6" fill="url(#cyanGlow)" filter="url(#glow)"/>
  <text x="60" y="102" fill="#5AC8FA" font-family="monospace" font-size="8.5" font-weight="bold">Cotovelo 100% Estendido</text>
  <text x="130" y="35" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Puxe os dedos para trás</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">ALONGAMENTO DE PUNHOS</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Prevenção LER/DORT • Túnel do Carpo</text>

</svg>