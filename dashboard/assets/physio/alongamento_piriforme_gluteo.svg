<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="240" height="160" rx="10" fill="#0D0F16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floor / Ground Line -->
  <line x1="20" y1="140" x2="220" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <circle cx="45" cy="130" r="8" fill="#1A1D28" stroke="#2A2E3D"/>
  <path d="M53 133 L105 133" stroke="#2A2E3D" stroke-width="4.5"/>
  <path d="M105 133 L135 90" stroke="#5AC8FA" stroke-width="4" stroke-linecap="round"/>
  <path d="M115 125 L155 105 L130 90" stroke="#D4FF00" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="118" cy="122" r="7" fill="url(#cyanGlow)" filter="url(#glow)"/>
  <path d="M145 85 L125 100" stroke="#D4FF00" stroke-width="2"/>
  <polygon points="125,100 132,96 130,104" fill="#D4FF00"/>
  <text x="125" y="78" fill="#D4FF00" font-family="monospace" font-size="8.5" font-weight="bold">Puxe a coxa no peito</text>
  <text x="85" y="148" fill="#5AC8FA" font-family="monospace" font-size="8.5" font-weight="bold">Formato do número 4</text>
  <text x="28" y="25" fill="#5AC8FA" font-family="sans-serif" font-size="10" font-weight="bold">PIRIFORME & GLÚTEO EM 4</text>
  <text x="28" y="38" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="8">Alívio do ciático • Destrava bacia</text>

</svg>