<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shoulderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Body Contour -->
  <path d="M100 25 C88 25 80 38 80 52 C60 60 50 78 45 105 C42 125 46 150 50 180 L150 180 C154 150 158 125 155 105 C150 78 140 60 120 52 C120 38 112 25 100 25 Z" stroke="#2A2E3D" stroke-width="2.5" fill="#12141D"/>
  <!-- Traps highlight -->
  <path d="M82 52 L100 40 L118 52 L100 75 Z" fill="url(#shoulderGlow)" opacity="0.75"/>
  <!-- Left Deltoid Highlight -->
  <path d="M78 55 C65 58 50 72 44 92 C40 108 48 118 56 115 C64 112 72 95 76 80 Z" fill="url(#shoulderGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Right Deltoid Highlight -->
  <path d="M122 55 C135 58 150 72 156 92 C160 108 152 118 144 115 C136 112 128 95 124 80 Z" fill="url(#shoulderGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Muscle Striations -->
  <path d="M50 85 Q62 90 70 85 M150 85 Q138 90 130 85" stroke="#FFE600" stroke-width="1.5" fill="none" opacity="0.8"/>
</svg>