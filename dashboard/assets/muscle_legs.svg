<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="legGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Pelvis Base -->
  <path d="M70 20 L130 20 L135 50 L65 50 Z" fill="#181B26" stroke="#2A2E3D" stroke-width="2"/>
  <!-- Left Thigh Outline -->
  <path d="M68 50 C55 65 50 90 52 115 C54 135 60 145 68 150 L88 150 C95 135 94 105 92 75 L92 50 Z" stroke="#2A2E3D" stroke-width="2" fill="#12141D"/>
  <!-- Right Thigh Outline -->
  <path d="M132 50 C145 65 150 90 148 115 C146 135 140 145 132 150 L112 150 C105 135 106 105 108 75 L108 50 Z" stroke="#2A2E3D" stroke-width="2" fill="#12141D"/>
  <!-- Left Quads Glow (Rectus Femoris & Vastus) -->
  <path d="M64 65 C55 80 56 105 60 125 C64 135 75 140 82 135 C88 125 88 100 86 75 Z" fill="url(#legGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Right Quads Glow -->
  <path d="M136 65 C145 80 144 105 140 125 C136 135 125 140 118 135 C112 125 112 100 114 75 Z" fill="url(#legGlow)" filter="url(#glowEffect)" opacity="0.95"/>
  <!-- Calves (Lower Legs) -->
  <path d="M66 155 C58 165 60 185 64 195 L84 195 C86 185 84 165 76 155 Z" fill="url(#legGlow)" opacity="0.8"/>
  <path d="M134 155 C142 165 140 185 136 195 L116 195 C114 185 116 165 124 155 Z" fill="url(#legGlow)" opacity="0.8"/>
</svg>